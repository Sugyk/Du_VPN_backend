services:

  db:
    image: postgres
    container_name: outline_postgres
    restart: always
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5436:5432"
  
  rest_api:
    image: golang:1.24
    command: go run cmd/main.go
    container_name: outline_rest_api
    restart: always
    environment:
      - DB_PASSWORD=postgres
    volumes:
      - .:/go/src/app
    working_dir: /go/src/app
    depends_on:
      - db
    ports:
      - "8080:8080"
