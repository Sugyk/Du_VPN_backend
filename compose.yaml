services:

  db:
    image: postgres
    container_name: outline_postgres
    restart: always
    # credentials are interpolated from .env, which compose loads automatically
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_DB=${DB_NAME:-postgres}
    ports:
      - "5436:5432"

  rest_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: outline_rest_api
    restart: always
    volumes:
      - go_mod_cache:/go/pkg/mod
      - .:/go/src/app
    environment:
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    depends_on:
      - db
    ports:
      - "8080:8080"

volumes:
  go_mod_cache:
